[package]
name = "hudbrowse"
version = "1.0.18"
description = "快速、轻量的悬浮浏览器"
authors = ["小鱼"]
license = "MIT"
repository = "https://github.com/yyl0124/HudBrowse"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "global-shortcut-all", "shell-open", "system-tray", "window-all", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
lazy_static = "1.4"
png = "0.17"
base64 = "0.21"
ureq = "2.12"
kuchikiki = "0.8"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }
winreg = "0.52"
webview2-com = "0.19.1"
windows_legacy = { package = "windows", version = "0.39" }
tokio = { version = "1", features = ["sync", "time"] }
